<div class="auth-shell">
  <main class="auth-panel">
    <div class="panel-header">
      <h2>Recuperar contraseña</h2>
      <p class="subtitle" *ngIf="!sent">Te enviaremos instrucciones a tu email</p>
      <p class="subtitle" *ngIf="sent">Revisa tu email para continuar</p>
    </div>

    <form class="auth-form" *ngIf="!sent" [formGroup]="form" (ngSubmit)="submit()" novalidate aria-live="polite">
      <div class="field" [class.field--error]="form.get('email')?.invalid && form.get('email')?.touched">
        <label for="email">Email</label>
        <div class="input-wrapper">
          <i class="bi bi-envelope"></i>
          <input id="email" type="email" formControlName="email" placeholder="tu@email.com" autocomplete="email" />
        </div>
        <p class="field-msg" *ngIf="form.get('email')?.invalid && form.get('email')?.touched">Email válido requerido</p>
      </div>

      <button type="submit" class="btn-primary-modern" [disabled]="form.invalid || loading">
        <span *ngIf="!loading">Enviar instrucciones</span>
        <span *ngIf="loading" class="loading-inline"><span class="spinner"></span> Enviando...</span>
      </button>

      <div class="form-message error" *ngIf="errorMsg">
        <i class="bi bi-exclamation-triangle"></i> {{ errorMsg }}
      </div>
      <div class="form-message success" *ngIf="successMsg">
        <i class="bi bi-check-circle"></i> {{ successMsg }}
      </div>
    </form>

    <div *ngIf="sent" class="auth-form">
      <div class="form-message success">
        <i class="bi bi-check-circle"></i> 
        Instrucciones enviadas. Revisa también la carpeta de spam.
      </div>
      <button routerLink="/auth/login" class="btn-primary-modern" type="button">
        Volver al login
      </button>
    </div>

    <div class="panel-footer">
      ¿Recordaste tu contraseña? 
      <a routerLink="/auth/login" class="link-bold">Iniciar sesión</a>
    </div>

    <div class="security-badge">
      <i class="bi bi-shield-check"></i>
      Proceso seguro de recuperación
    </div>
  </main>
</div>
