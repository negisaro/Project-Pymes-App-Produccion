<div class="auth-shell">
  <main class="auth-panel">
    <div class="panel-header">
      <h2>Nueva contraseña</h2>
      <p class="subtitle" *ngIf="!success">Ingresa tu nueva contraseña segura</p>
      <p class="subtitle" *ngIf="success">Contraseña actualizada correctamente</p>
    </div>

    <form class="auth-form" *ngIf="!success" [formGroup]="form" (ngSubmit)="submit()" novalidate aria-live="polite">
      <div class="field" [class.field--error]="form.get('password')?.invalid && form.get('password')?.touched">
        <label for="password">Nueva contraseña</label>
        <div class="input-wrapper">
          <i class="bi bi-lock"></i>
          <input id="password" type="password" formControlName="password" placeholder="••••••••" autocomplete="new-password" />
        </div>
        <p class="field-msg" *ngIf="form.get('password')?.invalid && form.get('password')?.touched">Contraseña requerida</p>
      </div>

      <button type="submit" class="btn-primary-modern" [disabled]="form.invalid || loading">
        <span *ngIf="!loading">Guardar contraseña</span>
        <span *ngIf="loading" class="loading-inline"><span class="spinner"></span> Guardando...</span>
      </button>

      <div class="form-message error" *ngIf="errorMsg">
        <i class="bi bi-exclamation-triangle"></i> {{ errorMsg }}
      </div>
      <div class="form-message success" *ngIf="successMsg">
        <i class="bi bi-check-circle"></i> {{ successMsg }}
      </div>
    </form>

    <div *ngIf="success" class="auth-form">
      <div class="form-message success">
        <i class="bi bi-check-circle"></i> 
        Tu contraseña ha sido actualizada exitosamente
      </div>
      <button routerLink="/auth/login" class="btn-primary-modern" type="button">
        Iniciar sesión
      </button>
    </div>

    <div class="panel-footer">
      ¿Cambio de planes? 
      <a routerLink="/auth/login" class="link-bold">Volver al login</a>
    </div>

    <div class="security-badge">
      <i class="bi bi-shield-check"></i>
      Cambio seguro de contraseña
    </div>
  </main>
</div>
