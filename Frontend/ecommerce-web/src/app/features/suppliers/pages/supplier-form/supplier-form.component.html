<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
          <h3 class="mb-0">
            <i class="fas fa-truck me-2"></i>
            {{ isEditing ? 'Edit Supplier' : 'Add New Supplier' }}
          </h3>
        </div>
        <div class="card-body">
          <form [formGroup]="supplierForm" (ngSubmit)="onSubmit()" autocomplete="off" novalidate>
            <div class="row g-3">
              <div class="col-md-6">
                <label for="nombre" class="form-label">
                  <i class="fas fa-building me-1 text-primary"></i>
                  Name
                </label>
                <input 
                  id="nombre" 
                  formControlName="nombre" 
                  maxlength="255" 
                  class="form-control" 
                  placeholder="Enter supplier name"
                  [ngClass]="{'is-invalid': supplierForm.get('nombre')?.invalid && supplierForm.get('nombre')?.touched}">
                <div *ngIf="supplierForm.get('nombre')?.invalid && supplierForm.get('nombre')?.touched" class="invalid-feedback">
                  Name is required.
                </div>
              </div>
              <div class="col-md-6">
                <label for="contacto" class="form-label">
                  <i class="fas fa-phone me-1 text-primary"></i>
                  Contact
                </label>
                <input 
                  id="contacto" 
                  formControlName="contacto" 
                  maxlength="255" 
                  class="form-control" 
                  placeholder="Enter contact information"
                  [ngClass]="{'is-invalid': supplierForm.get('contacto')?.invalid && supplierForm.get('contacto')?.touched}">
                <div *ngIf="supplierForm.get('contacto')?.invalid && supplierForm.get('contacto')?.touched" class="invalid-feedback">
                  Contact is required.
                </div>
              </div>
              <div class="col-12">
                <label for="descripcion" class="form-label">
                  <i class="fas fa-align-left me-1 text-primary"></i>
                  Description
                </label>
                <textarea 
                  id="descripcion" 
                  formControlName="descripcion" 
                  maxlength="1000" 
                  class="form-control" 
                  rows="4"
                  placeholder="Enter supplier description (optional)"></textarea>
                <div class="form-text">
                  <small class="text-muted">Maximum 1000 characters</small>
                </div>
              </div>
              <div class="col-md-6">
                <label for="activo" class="form-label">
                  <i class="fas fa-toggle-on me-1 text-primary"></i>
                  Status
                </label>
                <select id="activo" formControlName="activo" class="form-select">
                  <option [ngValue]="true">Active</option>
                  <option [ngValue]="false">Inactive</option>
                </select>
              </div>
            </div>
            <div class="d-flex gap-2 justify-content-end mt-4">
              <button type="submit" class="btn btn-primary" [disabled]="supplierForm.invalid || loading">
                <i class="fas fa-save me-1"></i> 
                {{ isEditing ? 'Update' : 'Save' }}
              </button>
              <button type="button" (click)="onClear()" class="btn btn-secondary">
                <i class="fas fa-eraser me-1"></i> Clear
              </button>
              <button type="button" (click)="goBack()" class="btn btn-outline-secondary">
                <i class="fas fa-arrow-left me-1"></i> Back
              </button>
            </div>
            <div *ngIf="loading" class="text-center mt-3">
              <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
