<div class="flyout-backdrop" *ngIf="open" (click)="close()"></div>
<aside class="flyout" *ngIf="open" role="dialog" aria-label="Carrito" aria-modal="true">
  <header class="flyout__header">
    <h2>Carrito ({{ cart.count() }})</h2>
    <button (click)="close()" aria-label="Cerrar">✕</button>
  </header>
  <div class="flyout__body" *ngIf="cart.items().length; else emptyTpl">
    <ul class="flyout__list">
      <li *ngFor="let item of cart.items()" class="flyout-item">
        <div class="flyout-item__media" aria-hidden="true">
          <img *ngIf="item.thumbnailUrl" [src]="item.thumbnailUrl" [alt]="item.name" />
        </div>
        <div class="flyout-item__main">
          <div class="flyout-item__name">{{ item.name }}</div>
          <div class="flyout-item__price">{{ item.price | currency:'USD' }}</div>
          <div class="flyout-item__qty">
            <label class="sr-only" [attr.for]="'qty-'+item.id">Cantidad</label>
            <input #qInput="ngModel" [id]="'qty-'+item.id" type="number" min="1" [ngModel]="item.qty" (ngModelChange)="update(item.id, +$event)" />
            <button type="button" class="link" (click)="remove(item.id)">Quitar</button>
          </div>
        </div>
      </li>
    </ul>
  </div>
  <ng-template #emptyTpl>
    <div class="flyout__empty">Tu carrito está vacío.</div>
  </ng-template>
  <footer class="flyout__footer">
    <div class="flyout__subtotal">
      <span>Subtotal</span><strong>{{ cart.total() | currency:'USD' }}</strong>
    </div>
    <div class="flyout__actions">
      <button class="btn btn--outline" (click)="clear()" [disabled]="!cart.items().length">Vaciar</button>
      <button class="btn" [disabled]="!cart.items().length">Ir a Checkout</button>
    </div>
  </footer>
</aside>
