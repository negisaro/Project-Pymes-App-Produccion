<div class="orders-list">
  <div class="orders-header mb-4">
    <h2 class="h4 text-primary">
      <i class="fas fa-shopping-cart me-2"></i>
      Gestión de Pedidos
    </h2>
    <p class="text-muted">Administra y supervisa todos los pedidos del sistema</p>
  </div>

  <div class="table-responsive">
    <table class="table table-hover orders-table" aria-label="Listado de pedidos">
      <thead class="table-primary">
        <tr>
          <th scope="col">ID</th>
          <th scope="col">Cliente</th>
          <th scope="col">Fecha</th>
          <th scope="col">Total</th>
          <th scope="col">Estado</th>
          <th scope="col">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let order of orders" class="align-middle">
          <td class="fw-bold">#{{ order.id }}</td>
          <td>{{ order.customer }}</td>
          <td>{{ order.date | date:'shortDate' }}</td>
          <td class="fw-bold text-success">{{ order.total | currency:'USD': 'symbol' }}</td>
          <td>
            <span 
              class="badge"
              [ngClass]="{
                'bg-warning': order.status === 'PENDING',
                'bg-success': order.status === 'COMPLETED',
                'bg-danger': order.status === 'CANCELLED'
              }">
              {{ order.status }}
            </span>
          </td>
          <td>
            <div class="btn-group btn-group-sm" role="group">
              <button type="button" class="btn btn-outline-primary" title="Ver detalles">
                <i class="fas fa-eye"></i>
              </button>
              <button type="button" class="btn btn-outline-secondary" title="Editar">
                <i class="fas fa-edit"></i>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="orders-footer mt-4">
    <div class="row">
      <div class="col-md-6">
        <small class="text-muted">
          Mostrando {{ orders.length }} pedidos
        </small>
      </div>
      <div class="col-md-6 text-end">
        <button type="button" class="btn btn-primary">
          <i class="fas fa-plus me-2"></i>
          Nuevo Pedido
        </button>
      </div>
    </div>
  </div>
</div>
