<aside class="admin-sidebar" [class.collapsed]="!(sidebarOpen$ | async)">
  <!-- Header con brand y toggle -->
  <div class="sidebar-header">
    <div class="sidebar-brand">
      <img src="assets/images/icons/favicon.ico" alt="Logo" class="brand-icon">
      <span class="brand-text">Admin Panel</span>
    </div>
    <button class="sidebar-toggle" (click)="toggleSidebar()" aria-label="Toggle sidebar">
      <i class="bi bi-chevron-left"></i>
    </button>
  </div>

  <!-- Navegación principal -->
  <nav class="sidebar-nav">
    <ul class="nav-list">
      <li class="nav-item" *ngFor="let item of items">
        <a [routerLink]="item.path"
           routerLinkActive="active"
           class="nav-link"
           [title]="item.label">
          <i class="nav-icon {{ getIconClass(item.label) }}"></i>
          <span class="nav-text">{{ item.label }}</span>
        </a>
      </li>
    </ul>
  </nav>

  <!-- Footer con acciones -->
  <div class="sidebar-footer">
    <a routerLink="/" class="footer-link" title="Volver al sitio">
      <i class="bi bi-house"></i>
      <span>Volver al sitio</span>
    </a>
    <button class="logout-btn" (click)="logout()" title="Cerrar sesión">
      <i class="bi bi-box-arrow-right"></i>
      <span>Cerrar sesión</span>
    </button>
  </div>
</aside>
