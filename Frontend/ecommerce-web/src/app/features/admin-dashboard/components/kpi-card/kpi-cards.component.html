<div class="row g-4 mb-4">
  <div class="col-12 col-sm-6 col-lg-3" *ngFor="let kpi of kpis">
    <div class="card kpi-card shadow h-100 border-0">
      <div class="card-body d-flex align-items-center">
        <div class="kpi-icon me-3" [ngClass]="kpi.bgClass"><i [class]="kpi.icon + ' fa-2x'"></i></div>
        <div>
          <div class="fs-3 fw-bold mb-1">{{ kpi.value }}</div>
          <div class="text-muted">{{ kpi.label }}</div>
        </div>
      </div>
    </div>
  </div>
</div>
