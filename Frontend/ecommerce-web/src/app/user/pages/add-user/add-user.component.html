
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
          <h3 class="mb-0">{{ isEditMode ? 'Editar Usuario' : 'Registrar Usuario' }}</h3>
        </div>
        <div class="card-body">
          <form [formGroup]="userForm" (ngSubmit)="onSubmit()" autocomplete="off" novalidate>
            <div class="row g-3">
              <div class="col-md-6">
                <label for="name" class="form-label">Nombre</label>
                <input id="name" formControlName="name" maxlength="100" class="form-control" [ngClass]="{'is-invalid': userForm.get('name')?.invalid && userForm.get('name')?.touched}">
                <div *ngIf="userForm.get('name')?.invalid && userForm.get('name')?.touched" class="invalid-feedback">Nombre es obligatorio.</div>
              </div>
              <div class="col-md-6">
                <label for="lastname" class="form-label">Apellido</label>
                <input id="lastname" formControlName="lastname" maxlength="100" class="form-control" [ngClass]="{'is-invalid': userForm.get('lastname')?.invalid && userForm.get('lastname')?.touched}">
                <div *ngIf="userForm.get('lastname')?.invalid && userForm.get('lastname')?.touched" class="invalid-feedback">Apellido es obligatorio.</div>
              </div>
              <div class="col-md-6">
                <label for="username" class="form-label">Usuario</label>
                <input id="username" formControlName="username" maxlength="50" class="form-control" [ngClass]="{'is-invalid': userForm.get('username')?.invalid && userForm.get('username')?.touched}">
                <div *ngIf="userForm.get('username')?.invalid && userForm.get('username')?.touched" class="invalid-feedback">Usuario es obligatorio (4-12 caracteres).</div>
              </div>
              <div class="col-md-6">
                <label for="email" class="form-label">Email</label>
                <input id="email" formControlName="email" maxlength="100" class="form-control" [ngClass]="{'is-invalid': userForm.get('email')?.invalid && userForm.get('email')?.touched}">
                <div *ngIf="userForm.get('email')?.invalid && userForm.get('email')?.touched" class="invalid-feedback">Email válido es obligatorio.</div>
              </div>
              <div class="col-md-6" *ngIf="!isEditMode">
                <label for="password" class="form-label">Contraseña</label>
                <input id="password" formControlName="password" type="password" class="form-control">
              </div>
              <div class="col-md-6">
                <label for="roles" class="form-label">Rol(es)</label>
                <select id="roles" formControlName="roles" multiple required class="form-select" [ngClass]="{'is-invalid': userForm.get('roles')?.invalid && userForm.get('roles')?.touched}">
                  <option *ngFor="let rol of rolesList" [ngValue]="rol.value">{{ rol.label }}</option>
                </select>
                <div *ngIf="userForm.get('roles')?.invalid && userForm.get('roles')?.touched" class="invalid-feedback">Selecciona al menos un rol.</div>
                <small class="text-muted">Mantén presionada la tecla Ctrl (Cmd en Mac) para seleccionar varios roles.</small>
              </div>
              <div class="col-12">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="active" formControlName="active">
                  <label class="form-check-label" for="active">Activo</label>
                </div>
              </div>
            </div>
            <div class="d-flex gap-2 justify-content-end mt-4">
              <button type="submit" class="btn btn-primary">
                <i class="bi bi-person-plus-fill"></i> {{ isEditMode ? 'Actualizar' : 'Registrar' }}
              </button>
              <button type="button" (click)="onClear()" class="btn btn-secondary">
                <i class="bi bi-eraser"></i> Limpiar
              </button>
            </div>
            <div *ngIf="loading" class="text-center mt-3">
              <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Cargando...</span>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
