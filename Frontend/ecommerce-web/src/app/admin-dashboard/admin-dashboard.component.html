<div class="d-flex" [ngClass]="{'toggled': !sidebarOpen}">
  <!-- Sidebar -->
  <nav class="sidebar bg-dark text-white flex-shrink-0 p-3" [ngClass]="{'collapsed': !sidebarOpen}">
    <div class="sidebar-header d-flex align-items-center justify-content-between mb-4">
      <span class="fs-4 fw-bold">PYMES Admin</span>
      <button class="btn btn-sm btn-outline-light d-md-none" (click)="toggleSidebar()">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <ul class="nav nav-pills flex-column mb-auto">
      <li class="nav-item">
        <a routerLink="/dashboard" routerLinkActive="active" class="nav-link text-white">
          <i class="fas fa-tachometer-alt me-2"></i> Inicio
        </a>
      </li>
      <li>
        <a routerLink="/dashboard/user" routerLinkActive="active" class="nav-link text-white">
          <i class="fas fa-users me-2"></i> Usuarios
        </a>
      </li>
      <li>
        <a routerLink="/dashboard/product" routerLinkActive="active" class="nav-link text-white">
          <i class="fas fa-boxes me-2"></i> Productos
        </a>
      </li>
      <li>
        <a routerLink="/dashboard/categoria" routerLinkActive="active" class="nav-link text-white">
          <i class="fas fa-tags me-2"></i> Categorías
        </a>
      </li>
      <li>
        <a routerLink="/dashboard/proveedor" routerLinkActive="active" class="nav-link text-white">
          <i class="fas fa-truck me-2"></i> Proveedores
        </a>
      </li>
      <!-- Agrega más módulos aquí -->
    </ul>
    <hr>
    <div class="sidebar-footer">
      <a routerLink="/" class="nav-link text-white"><i class="fas fa-home me-2"></i> Volver al sitio</a>
    </div>
  </nav>

  <!-- Main content -->
  <div class="flex-grow-1 min-vh-100 bg-light">
    <!-- Top navbar -->
    <nav class="navbar navbar-expand navbar-light bg-white shadow-sm px-3">
      <button class="btn btn-outline-primary d-md-none me-2" (click)="toggleSidebar()">
        <i class="fas fa-bars"></i>
      </button>
      <span class="navbar-brand mb-0 h1">Panel Administrativo</span>
      <div class="ms-auto">
        <!-- Aquí puedes agregar usuario, notificaciones, etc. -->
        <span class="me-3"><i class="fas fa-user-circle"></i> Admin</span>
      </div>
    </nav>
    <main class="p-4">
      <!-- Widgets resumen -->
      <div class="row g-4 mb-4">
        <div class="col-12 col-md-6 col-lg-3">
          <div class="card shadow-sm border-0 h-100">
            <div class="card-body d-flex align-items-center">
              <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center me-3" style="width:48px;height:48px;">
                <i class="fas fa-users fa-lg"></i>
              </div>
              <div>
                <div class="fs-4 fw-bold">1,234</div>
                <div class="text-muted">Usuarios</div>
              </div>
            </div>
          </div>
        </div>
        <div class="col-12 col-md-6 col-lg-3">
          <div class="card shadow-sm border-0 h-100">
            <div class="card-body d-flex align-items-center">
              <div class="bg-success text-white rounded-circle d-flex align-items-center justify-content-center me-3" style="width:48px;height:48px;">
                <i class="fas fa-boxes fa-lg"></i>
              </div>
              <div>
                <div class="fs-4 fw-bold">567</div>
                <div class="text-muted">Productos</div>
              </div>
            </div>
          </div>
        </div>
        <div class="col-12 col-md-6 col-lg-3">
          <div class="card shadow-sm border-0 h-100">
            <div class="card-body d-flex align-items-center">
              <div class="bg-warning text-white rounded-circle d-flex align-items-center justify-content-center me-3" style="width:48px;height:48px;">
                <i class="fas fa-shopping-cart fa-lg"></i>
              </div>
              <div>
                <div class="fs-4 fw-bold">$12,345</div>
                <div class="text-muted">Ventas</div>
              </div>
            </div>
          </div>
        </div>
        <div class="col-12 col-md-6 col-lg-3">
          <div class="card shadow-sm border-0 h-100">
            <div class="card-body d-flex align-items-center">
              <div class="bg-info text-white rounded-circle d-flex align-items-center justify-content-center me-3" style="width:48px;height:48px;">
                <i class="fas fa-tags fa-lg"></i>
              </div>
              <div>
                <div class="fs-4 fw-bold">12</div>
                <div class="text-muted">Categorías</div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
