<apx-chart
  [series]="[{ data: data } ]"
  [chart]="{ type: type, height: 40, sparkline: { enabled: true } }"
  [colors]="[color]"
  [stroke]="{ width: 2 }"
  [tooltip]="{ enabled: false }"
  [xaxis]="{ labels: { show: false } }"
  [yaxis]="{ show: false }"
  [dataLabels]="{ enabled: false }"
  height="40">
</apx-chart>
