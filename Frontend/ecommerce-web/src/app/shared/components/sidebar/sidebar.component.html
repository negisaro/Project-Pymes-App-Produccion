<nav class="sidebar-modern" [ngClass]="{collapsed: collapsed}">
	<ng-container *ngIf="user$ | async as currentUser">
			<div class="sidebar-brand d-flex align-items-center mb-4">
				<span class="sidebar-icon"><img src="assets/images/icons/favicon.ico" width="32" height="32" alt="Logo"></span>
				<span *ngIf="!collapsed">Glow Dreams</span>
				<button class="sidebar-toggle ms-auto" (click)="collapsed = !collapsed" aria-label="Colapsar menú">
					<span [ngClass]="{rotate: collapsed}"><i class="bi bi-chevron-left"></i></span>
				</button>
			</div>
			<div class="sidebar-profile mb-4" [ngClass]="{collapsed: collapsed}">
				<div class="sidebar-avatar"><img src="assets/images/icons/favicon.ico" alt="Avatar"></div>
				<div class="sidebar-user-info ms-2" *ngIf="!collapsed">
					<span class="sidebar-user-name">{{ currentUser?.name }} {{ currentUser?.lastname }}</span>
					<span class="sidebar-user-role">{{ getRoleLabel(currentUser?.roles?.[0]?.name) }}</span>
				</div>
			</div>
			<ul class="nav flex-column sidebar-content">
				<ng-container *ngIf="isAdmin">
					<li class="nav-item"><a class="nav-link" routerLink="/dashboard-admin" routerLinkActive="active"><span class="sidebar-icon"><i class="bi bi-speedometer2"></i></span><span>Tablero</span></a></li>
					<li class="nav-item"><a class="nav-link" routerLink="/dashboard-admin/user" routerLinkActive="active"><span class="sidebar-icon"><i class="bi bi-people"></i></span><span>Usuarios</span></a></li>
					<li class="nav-item"><a class="nav-link" routerLink="/dashboard-admin/product" routerLinkActive="active"><span class="sidebar-icon"><i class="bi bi-box"></i></span><span>Productos</span></a></li>
					<li class="nav-item"><a class="nav-link" routerLink="/dashboard-admin/categoria" routerLinkActive="active"><span class="sidebar-icon"><i class="bi bi-tags"></i></span><span>Categorías</span></a></li>
					<li class="nav-item"><a class="nav-link" routerLink="/dashboard-admin/proveedor" routerLinkActive="active"><span class="sidebar-icon"><i class="bi bi-truck"></i></span><span>Proveedores</span></a></li>
				</ng-container>
				<ng-container *ngIf="isCliente">
					<li class="nav-item"><a class="nav-link" routerLink="/" routerLinkActive="active"><span class="sidebar-icon"><i class="bi bi-house"></i></span><span>Inicio</span></a></li>
					<li class="nav-item"><a class="nav-link" routerLink="/buscar" routerLinkActive="active"><span class="sidebar-icon"><i class="bi bi-search"></i></span><span>Buscar</span></a></li>
					<li class="nav-item"><a class="nav-link" routerLink="/home" routerLinkActive="active"><span class="sidebar-icon"><i class="bi bi-cart3"></i></span><span>Carrito</span></a></li>
				</ng-container>
			</ul>
			<div class="mt-auto mb-3 px-2">
				<button class="btn btn-outline-danger w-100 d-flex align-items-center justify-content-center gap-2" (click)="logout()">
					<i class="bi bi-box-arrow-right"></i>
					<span *ngIf="!collapsed">Cerrar sesión</span>
				</button>
			</div>
		</ng-container>
</nav>
