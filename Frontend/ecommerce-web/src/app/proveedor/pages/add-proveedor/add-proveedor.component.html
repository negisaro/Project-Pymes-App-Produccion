
<div class="add-proveedor-container card sombra">
	<h2 class="titulo">{{ esEdicion ? 'Editar proveedor' : 'Agregar proveedor' }}</h2>
	<form #f="ngForm" (ngSubmit)="guardarProveedor()">
		<div class="form-group">
			<label for="nombre">Nombre *</label>
			<input id="nombre" name="nombre" [(ngModel)]="proveedor.nombre" required maxlength="255" class="form-control" />
		</div>
		<div class="form-group">
			<label for="descripcion">Descripción</label>
			<textarea id="descripcion" name="descripcion" [(ngModel)]="proveedor.descripcion" maxlength="1000" class="form-control"></textarea>
		</div>
		<div class="form-group">
			<label for="contacto">Contacto *</label>
			<input id="contacto" name="contacto" [(ngModel)]="proveedor.contacto" required maxlength="255" class="form-control" />
		</div>
		<div class="form-group">
			<label for="activo">Estado *</label>
			<select id="activo" name="activo" [(ngModel)]="proveedor.activo" required class="form-control">
				<option [ngValue]="true">Activo</option>
				<option [ngValue]="false">Inactivo</option>
			</select>
		</div>
		<div class="acciones-formulario">
			<button class="btn btn-guardar" type="submit" [disabled]="f.invalid">{{ esEdicion ? 'Actualizar' : 'Guardar' }}</button>
			<button class="btn btn-cancelar" type="button" (click)="volver()">Cancelar</button>
		</div>
	</form>
</div>
