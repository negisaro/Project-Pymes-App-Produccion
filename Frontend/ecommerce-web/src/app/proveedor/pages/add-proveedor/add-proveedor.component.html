
<div class="container py-4">
	<div class="row justify-content-center">
		<div class="col-lg-8">
			<div class="card shadow-sm">
				<div class="card-header bg-primary text-white">
					<h3 class="mb-0">{{ esEdicion ? 'Editar Proveedor' : 'Registrar Proveedor' }}</h3>
				</div>
				<div class="card-body">
					<form [formGroup]="proveedorForm" (ngSubmit)="onSubmit()" autocomplete="off" novalidate>
						<div class="row g-3">
							<div class="col-md-6">
								<label for="nombre" class="form-label">Nombre</label>
								<input id="nombre" formControlName="nombre" maxlength="255" class="form-control" [ngClass]="{'is-invalid': proveedorForm.get('nombre')?.invalid && proveedorForm.get('nombre')?.touched}">
								<div *ngIf="proveedorForm.get('nombre')?.invalid && proveedorForm.get('nombre')?.touched" class="invalid-feedback">Nombre es obligatorio.</div>
							</div>
							<div class="col-md-6">
								<label for="contacto" class="form-label">Contacto</label>
								<input id="contacto" formControlName="contacto" maxlength="255" class="form-control" [ngClass]="{'is-invalid': proveedorForm.get('contacto')?.invalid && proveedorForm.get('contacto')?.touched}">
								<div *ngIf="proveedorForm.get('contacto')?.invalid && proveedorForm.get('contacto')?.touched" class="invalid-feedback">Contacto es obligatorio.</div>
							</div>
							<div class="col-12">
								<label for="descripcion" class="form-label">Descripción</label>
								<textarea id="descripcion" formControlName="descripcion" maxlength="1000" class="form-control"></textarea>
							</div>
							<div class="col-md-6">
								<label for="activo" class="form-label">Estado</label>
								<select id="activo" formControlName="activo" class="form-select">
									<option [ngValue]="true">Activo</option>
									<option [ngValue]="false">Inactivo</option>
								</select>
							</div>
						</div>
						<div class="d-flex gap-2 justify-content-end mt-4">
							<button type="submit" class="btn btn-primary" [disabled]="proveedorForm.invalid || loading">
								<i class="bi bi-person-plus-fill"></i> {{ esEdicion ? 'Actualizar' : 'Registrar' }}
							</button>
							<button type="button" (click)="onClear()" class="btn btn-secondary">
								<i class="bi bi-eraser"></i> Limpiar
							</button>
							<button type="button" (click)="volver()" class="btn btn-outline-secondary">
								<i class="bi bi-arrow-left"></i> Volver
							</button>
						</div>
						<div *ngIf="loading" class="text-center mt-3">
							<div class="spinner-border text-primary" role="status">
								<span class="visually-hidden">Cargando...</span>
							</div>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>
</div>
