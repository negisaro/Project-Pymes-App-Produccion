<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
          <h3 class="mb-0">{{ modoEdicion ? 'Editar Categoría' : 'Registrar Categoría' }}</h3>
        </div>
        <div class="card-body">
          <form [formGroup]="categoriaForm" (ngSubmit)="onSubmit()" autocomplete="off" novalidate>
            <div class="row g-3">
              <div class="col-md-6">
                <label for="nombre" class="form-label">Nombre</label>
                <input id="nombre" formControlName="nombre" maxlength="100" class="form-control" [ngClass]="{'is-invalid': categoriaForm.get('nombre')?.invalid && categoriaForm.get('nombre')?.touched}">
                <div *ngIf="categoriaForm.get('nombre')?.invalid && categoriaForm.get('nombre')?.touched" class="invalid-feedback">Nombre es obligatorio.</div>
              </div>
              <div class="col-12">
                <label for="descripcion" class="form-label">Descripción</label>
                <textarea id="descripcion" formControlName="descripcion" maxlength="255" class="form-control"></textarea>
              </div>
              <div class="col-md-6">
                <label for="estado" class="form-label">Estado</label>
                <select id="estado" formControlName="estado" class="form-select">
                  <option [ngValue]="true">Activo</option>
                  <option [ngValue]="false">Inactivo</option>
                </select>
              </div>
            </div>
            <div class="d-flex gap-2 justify-content-end mt-4">
              <button type="submit" class="btn btn-primary" [disabled]="categoriaForm.invalid">
                <i class="bi bi-person-plus-fill"></i> {{ modoEdicion ? 'Actualizar' : 'Registrar' }}
              </button>
              <button type="button" (click)="onClear()" class="btn btn-secondary">
                <i class="bi bi-eraser"></i> Limpiar
              </button>
              <button type="button" (click)="router.navigate(['/dashboard/categoria/list'])" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left"></i> Volver
              </button>
            </div>
            <div *ngIf="mensaje" class="alert alert-success mt-3">{{ mensaje }}</div>
            <div *ngIf="errores.length">
              <div *ngFor="let error of errores" class="alert alert-danger mt-2">{{ error.mensaje }}</div>
            </div>
            <div *ngIf="debugResponse">
              <strong>Respuesta backend:</strong>
              <pre>{{ debugResponse | json }}</pre>
            </div>
            <div *ngIf="debugError">
              <strong>Error backend:</strong>
              <pre>{{ debugError | json }}</pre>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
