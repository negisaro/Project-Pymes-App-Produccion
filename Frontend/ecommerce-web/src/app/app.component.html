
<div class="app-bg-gradient">
  <ng-container *ngIf="loading$ | async">
    <div class="app-loading-overlay-premium">
      <div class="spinner-aurora">
        <span class="aurora-dot dot1"></span>
        <span class="aurora-dot dot2"></span>
        <span class="aurora-dot dot3"></span>
        <span class="aurora-dot dot4"></span>
      </div>
      <span class="mt-4 spinner-title">Cargando la experiencia Glow Dreams...</span>
    </div>
  </ng-container>
  <router-outlet></router-outlet>
</div>
