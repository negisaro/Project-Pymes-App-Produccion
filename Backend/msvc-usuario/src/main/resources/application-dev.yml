spring:
  application:
    name: msvc-usuario

  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?serverTimezone=America/Bogota
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    default-encoding: UTF-8

server:
  port: 8081

eureka:
  instance:
    instance-id: ${spring.cloud.client.hostname}:${spring.application.name}:${random.value}
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL}

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  api-docs:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  secret:
    jwt-secret: ${GATEWAY_JWT_SECRET}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  mail:
    debug: ${MAIL_DEBUG:false}

# Notas de configuración:
# - Definir variables de entorno para desarrollo local (Windows cmd):
#   set MAIL_USERNAME=tu_correo@gmail.com
#   set MAIL_PASSWORD=tu_app_password_generada
#   set FRONTEND_URL=http://localhost:4200
#   set MAIL_DEBUG=true
# - En PowerShell usar: $env:MAIL_USERNAME="..." etc.
# - JAMÁS commitear la app password real / secrets.
