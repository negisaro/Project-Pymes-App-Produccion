# ========================================
# Gateway configuration for user-service, product-service, and carrito-service
# ========================================

spring:
  application:
    name: gateway
  cloud:
    gateway:
      default-filters:
        # Rate limiter to prevent abuse
        - name: RequestRateLimiter
          args:
            key-resolver: "#{@remoteAddressKeyResolver}"
            redis-rate-limiter.replenishRate: 10
            redis-rate-limiter.burstCapacity: 20
        # Circuit breaker for fault tolerance
        - name: CircuitBreaker
          args:
            name: myCircuitBreaker
            fallbackUri: forward:/fallback
      server:
        webflux:
          globalcors:
            cors-configurations:
              "[/**]":
                allowed-origins: "http://localhost:4200"
                allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
                allowed-headers: "*"
                exposed-headers: "Authorization,X-Usuario,X-Roles,X-Email,X-JWT-Id"
                allow-credentials: true
      routes:
        # =============================
        # USER SERVICE ROUTES
        # =============================

        # Auth endpoints (login, register)
        # No JWT required
        - id: usuario
          uri: lb://usuario
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1

        - id: usuario
          uri: lb://usuario
          predicates:
            - Path=/api/usuarios/**
          filters:
            - StripPrefix=1

        # Protected access: /api/segura/usuarios/*
        # JWT required
        - id: usuario-secure
          uri: lb://usuario
          predicates:
            - Path=/api/segura/usuarios/**
          filters:
            - StripPrefix=2

        # =============================
        # PRODUCT SERVICE ROUTES
        # =============================

        # Public access: /api/productos/*
        # No JWT required
        - id: msvc-producto
          uri: lb://msvc-producto
          predicates:
            - Path=/api/productos/**
          filters:
            - StripPrefix=1

        # Protected access: /api/segura/productos/*
        # JWT required
        - id: msvc-producto-secure
          uri: lb://msvc-producto
          predicates:
            - Path=/api/segura/productos/**
          filters:
            - StripPrefix=2

        # =============================
        # CARRITO SERVICE ROUTES
        # =============================

        # Public access: /api/carrito/*
        # No JWT required (consultas públicas si aplica)
        - id: msvc-carrito
          uri: lb://msvc-carrito
          predicates:
            - Path=/api/carrito/**
          filters:
            - StripPrefix=1

        # Protected access: /api/segura/carrito/*
        # JWT required (agregar/quitar ítems, pagar, etc.)
        - id: msvc-carrito-secure
          uri: lb://msvc-carrito
          predicates:
            - Path=/api/segura/carrito/**
          filters:
            - StripPrefix=2

        # =============================
        # CATEGORIA SERVICE ROUTES
        # =============================

        # Public access: /api/categoria/*
        # No JWT required (consultas públicas si aplica)
        - id: msvc-categoria
          uri: lb://msvc-categoria
          predicates:
            - Path=/api/categorias/**
          filters:
            - StripPrefix=1

        # Protected access: /api/segura/categorias/*
        # JWT required (agregar/quitar ítems, pagar, etc.)
        - id: msvc-categoria-secure
          uri: lb://msvc-categoria
          predicates:
            - Path=/api/segura/categorias/**
          filters:
            - StripPrefix=2

        # =============================
        # PROVEEDOR SERVICE ROUTES
        # =============================

        # Public access: /api/proveedores/*
        # No JWT required (consultas públicas si aplica)
        - id: msvc-proveedor
          uri: lb://msvc-proveedor
          predicates:
            - Path=/api/proveedores/**
          filters:
            - StripPrefix=1

        # Protected access: /api/segura/proveedores/*
        # JWT required (agregar/quitar ítems, pagar, etc.)
        - id: msvc-proveedor-secure
          uri: lb://msvc-proveedor
          predicates:
            - Path=/api/segura/proveedores/**
          filters:
            - StripPrefix=2

        # =============================
        # ORDEN SERVICE ROUTES
        # =============================

        # Public access: /api/orden/*
        # No JWT required (consultas públicas si aplica)
        - id: msvc-orden
          uri: lb://msvc-orden
          predicates:
            - Path=/api/orden/**
          filters:
            - StripPrefix=1

        # Protected access: /api/segura/orden/*
        # JWT required (agregar/quitar ítems, pagar, etc.)
        - id: msvc-orden-secure
          uri: lb://msvc-orden
          predicates:
            - Path=/api/segura/orden/**
          filters:
            - StripPrefix=2

gateway:
  filter:
    # JWT secret for signing and verifying tokens
    jwt-secret: ${GATEWAY_JWT_SECRET:dev_secret}
    # Only paths starting with /api/segura/ are protected by JWT
    conditional-path: /api/segura/
    # Allowed roles for JWT authentication
    allowed-roles: ROLE_ADMIN,ROLE_USER
    # Custom claim mappings for role and email in the JWT
    role-claim: roles
    username-claim: username
    order: 100
    # Paths that are always public, even if under /api/segura/
    exempt-paths: /auth/login,/usuarios/register

  security:
    user:
      name: admin
      password: ${GATEWAY_DASHBOARD_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

server:
  port: 8080
  ssl:
    enabled: false

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://eureka-server:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "health,info"
  endpoint:
    health:
      show-details: always
