
services:
  eureka-server:
    build: ./backend/eureka-server
    container_name: eureka-server
    env_file: .env
    ports:
      - "8761:8761"
    environment:
      # SPRING_PROFILES_ACTIVE ya viene de .env; permitir override si se necesita
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      EUREKA_DASHBOARD_PASSWORD: ${EUREKA_DASHBOARD_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-kf", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  gateway:
    build: ./backend/gateway
    container_name: gateway
    env_file: .env
    ports:
      - "8080:8080"
    # Notas: Variables JWT (GATEWAY_JWT_SECRET, expiración, issuer, audience) se inyectan desde .env
    depends_on:
      - eureka-server
      - redis
      - db
      - usuario
    healthcheck:
      test: ["CMD", "curl", "-kf", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: redis
    env_file: .env
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  db:
    image: mysql:8.0
    container_name: db
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${MYSQL_USER}", "-p${MYSQL_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 40

  usuario:
    build: ./backend/msvc-usuario
    container_name: msvc-usuario
    env_file: .env
    ports:
      - "8081:8081"
    environment:
      # Override host de DB al nombre del servicio interno
      MYSQL_HOST: db
    depends_on:
      db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-kf", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  carrito:
    build: ./backend/msvc-carrito
    container_name: msvc-carrito
    env_file: .env
    ports:
      - "8082:8082"
    environment:
      MYSQL_HOST: db
    depends_on:
      db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-kf", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  categoria:
    build: ./backend/msvc-categoria
    container_name: msvc-categoria
    env_file: .env
    ports:
      - "8083:8083"
    environment:
      MYSQL_HOST: db
    depends_on:
      db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-kf", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  proveedor:
    build: ./backend/msvc-proveedor
    container_name: msvc-proveedor
    env_file: .env
    ports:
      - "8084:8084"
    environment:
      MYSQL_HOST: db
    depends_on:
      db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-kf", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  producto:
    build: ./backend/msvc-producto
    container_name: msvc-producto
    env_file: .env
    ports:
      - "8085:8085"
    environment:
      MYSQL_HOST: db
    volumes:
      - ./backend/msvc-producto/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-kf", "http://localhost:8085/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  orden:
    build: ./backend/msvc-orden
    container_name: msvc-orden
    env_file: .env
    ports:
      - "8086:8086"
    environment:
      MYSQL_HOST: db
    depends_on:
      db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-kf", "http://localhost:8086/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  frontend:
    build: ./frontend/ecommerce-web
    container_name: ecommerce-web
    env_file: .env
    ports:
      - "4200:80"
    depends_on:
      - gateway
    healthcheck:
      test: ["CMD", "curl", "-kf", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  db_data: